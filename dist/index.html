<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#123e30"><meta name="description" content="蛋珠机：奶蛙世界的拉杆弹珠游戏。锁定亮灯通道，蓄力发射奶蛋，赢取更多虚拟奶蛋。"><title>蛋珠机 · Egg Pachinko</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23123e30'/%3E%3Cellipse cx='16' cy='17' rx='10' ry='12' fill='%23ffdc46'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css?v=arcade-2"></head><body>
<main class="arcade" aria-label="蛋珠机游戏"><div class="machine">
<header class="marquee"><h1>蛋珠机<span>★</span></h1><img class="mascot" src="assets/frog.png" alt="看热闹的奶蛙"><div class="top-actions"><button id="sound" aria-label="开启声音" aria-pressed="false">声音 关</button><button id="help">玩法</button></div></header>
<section class="scoreboard" aria-label="本局计数"><div><span>奶蛋库存</span><strong id="stock">100</strong></div><div><span>本局投入</span><strong id="stake">1</strong></div><div><span>倍率</span><strong id="multiplier">—</strong></div></section>
<div class="cabinet"><div class="board-top"><span id="boardPhase">等待启动</span><span>亮灯才算赢</span></div><canvas id="board" width="540" height="740" aria-label="奶蛋从右侧轨道发射，经过钉板落入底部通道"></canvas><div id="toast" class="toast" role="status" aria-live="polite"><b id="commentTitle"></b><p id="commentText"></p></div></div>
<section class="control-deck" aria-label="机台操作"><div class="stake-controls"><span class="control-caption">投入调整</span><div class="adjust"><button id="minus" aria-label="减少投入">−</button><button id="plus" aria-label="增加投入">＋</button></div><div class="step-switch" role="group" aria-label="每次增减数量"><span>每次</span><button data-step="1" aria-pressed="true">1</button><button data-step="5" aria-pressed="false">5</button><button data-step="10" aria-pressed="false">10</button></div></div><div class="start-control"><button id="lock">启动</button><span>扣蛋 · 开灯</span></div><div class="plunger-control"><div class="charge-meter"><div id="chargeFill"></div></div><button id="launch" disabled aria-label="按住蓄力，松开发射"><span class="plunger-shaft"></span><span class="plunger-knob"></span><span id="launchLabel">蓄力</span></button><span id="chargeText">等待启动</span></div></section>
<footer class="machine-foot"><span>最高 <b id="best">100</b> · 可得 <b id="reward">—</b></span><button id="reset">重新开局</button></footer>
</div></main>
<dialog id="helpDialog"><button id="closeHelp" class="dialog-close" aria-label="关闭玩法">×</button><span class="eyebrow">怎么弹？</span><h2>让奶蛋走对门。</h2><ol><li>选择本局投入的奶蛋数。</li><li>锁定倍率和底部亮灯通道。</li><li>按住发射按钮或空格蓄力，松开发射。</li><li>奶蛋通过亮灯通道时，获得投入数 × 倍率。落入其他通道则没有奖励。</li></ol><p>每局只发射一颗母球。力度太小、没有进入钉板区时，可以再次蓄力，不重复扣除奶蛋。</p><p>倍率越高，亮灯通道越少。奶蛋的碰撞和落点由实际运动决定。</p></dialog>
<script src="physics.js"></script><script src="game.js?v=arcade-2"></script></body></html>
